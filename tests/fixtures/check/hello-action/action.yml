name: Hello check
description: Says hello to a file.
inputs:
  token:
    description: Token for the API.
    required: true
  file:
    description: File to greet.
    required: false
    default: README.md
outputs:
  count:
    description: How many greetings were sent.
runs:
  using: composite
  steps:
    - shell: bash
      run: echo hello
