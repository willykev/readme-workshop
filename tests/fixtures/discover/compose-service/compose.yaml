services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shelf:shelf@db/shelf
      LOG_LEVEL: info
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=shelf
      - POSTGRES_PASSWORD=shelf
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data:
